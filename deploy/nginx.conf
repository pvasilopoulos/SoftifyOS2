server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;

    location /api {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/api/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

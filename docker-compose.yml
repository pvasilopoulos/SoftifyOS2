services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: softifyos
      MYSQL_USER: softify
      MYSQL_PASSWORD: softify
      MYSQL_ROOT_PASSWORD: softify
    volumes:
      - mysql:/var/lib/mysql
      - ./apps/api/schema/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usoftify", "-psoftify"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: .
      dockerfile: deploy/php.Dockerfile
    restart: unless-stopped
    environment:
      SOFTIFY_DB_HOST: db
      SOFTIFY_DB_NAME: softifyos
      SOFTIFY_DB_USER: softify
      SOFTIFY_DB_PASS: softify
    volumes:
      - ./apps/api:/var/www/apps/api:ro
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: deploy/php.Dockerfile
    environment:
      SOFTIFY_DB_HOST: db
      SOFTIFY_DB_NAME: softifyos
      SOFTIFY_DB_USER: softify
      SOFTIFY_DB_PASS: softify
    volumes:
      - ./apps/api:/var/www/apps/api:ro
    depends_on:
      db:
        condition: service_healthy
    command: php /var/www/apps/api/schema/seed.php
    restart: "no"
    profiles:
      - seed

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/var/www/html:ro
    depends_on:
      - php

volumes:
  mysql:
